services:
  - type: web
    name: wc2026-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: false
        value: admin1234
      - key: MONGO_URI
        sync: false          # you paste this from MongoDB Atlas
      - key: PORT
        value: 10000
